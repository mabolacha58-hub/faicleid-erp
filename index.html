<!DOCTYPE html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FaiCleid ERP" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- SEO / Meta -->
    <title>FaiCleid ERP — Sistema de Gestão Escolar</title>
    <meta name="description" content="Sistema de Gestão Escolar do Instituto Politécnico FaiCleid, LDA — Maputo, Moçambique" />
    <meta name="application-name" content="FaiCleid ERP" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #0b0f1a; color: #e2e8f0; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }

      /* Splash screen enquanto carrega */
      #splash {
        position: fixed; inset: 0; background: #0b0f1a;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 99999; transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 72px; height: 72px; border-radius: 18px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 0 40px rgba(99,102,241,0.4);
      }
      .splash-logo svg { width: 40px; height: 40px; }
      .splash-title { font-size: 20px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
      .splash-sub { font-size: 12px; color: #4a5568; margin-bottom: 32px; }
      .splash-spinner {
        width: 28px; height: 28px;
        border: 2px solid #1a2035; border-top-color: #6366f1;
        border-radius: 50%; animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M256 60L420 155V345L256 440L92 345V155L256 60Z" stroke="rgba(255,255,255,0.5)" stroke-width="4" fill="none"/>
          <path d="M165 360V160H350" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M165 255H315" stroke="white" stroke-width="22" stroke-linecap="round" fill="none"/>
          <circle cx="165" cy="390" r="14" fill="rgba(255,255,255,0.6)"/>
        </svg>
      </div>
      <div class="splash-title">FaiCleid ERP</div>
      <div class="splash-sub">Instituto Politécnico FaiCleid, LDA</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Esconder splash quando a app carregar
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.classList.add('hidden');
        }, 800);
      });
    </script>
  </body>
</html>
